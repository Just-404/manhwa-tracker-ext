<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manhwa Tracking</title>
    <!--
      Estilos críticos de arranque. Garantizan fondo y tamaño del panel antes
      de que React monte, para que el popup de Firefox nunca se muestre vacío.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #131a2a;
        color: #e8edfa;
        color-scheme: dark;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #root {
        width: 380px;
      }
      .boot {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        min-height: 220px;
        color: #97a5c6;
        font-size: 0.85rem;
      }
      .boot::before {
        content: "";
        width: 15px;
        height: 15px;
        border: 2px solid #33436a;
        border-top-color: #4f7cff;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="modal-root"></div>
    <div id="root"><div class="boot">Loading…</div></div>
    <script type="module" src="/src/mainPopup.jsx"></script>
  </body>
</html>
